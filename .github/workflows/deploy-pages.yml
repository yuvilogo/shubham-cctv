name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Work out the asset base path
        id: base
        # Project sites are served from /<repo>/, but a user site named
        # <user>.github.io is served from the domain root.
        run: |
          REPO="${{ github.event.repository.name }}"
          case "$REPO" in
            *.github.io) echo "value=/" >> "$GITHUB_OUTPUT" ;;
            *)           echo "value=/$REPO/" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
        run: npm run build

      - name: Add SPA fallback
        # Deep links like /some-path should render the app instead of a 404.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
